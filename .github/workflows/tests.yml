name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ['snapshots/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements-dev.txt

      # the extractor tests render fixture pages in real chromium (offline)
      - run: playwright install --with-deps chromium

      - run: pytest -v
