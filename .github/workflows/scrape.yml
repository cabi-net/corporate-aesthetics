name: Weekly Scrape

on:
  schedule:
    - cron: '0 9 * * 1'  # every Monday at 9am UTC
  workflow_dispatch:       # allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # exits non-zero if any target fails validation, which fails the run
      # (and emails you) — but only after the good targets are saved
      - name: Run scraper
        run: python scrape.py

      - name: Commit snapshots
        if: always()
        run: |
          git config user.name "palimpsest bot"
          git config user.email "bot@palimpsest"
          git add snapshots/
          git diff --staged --quiet || git commit -m "snapshot: $(date -u +%Y-%m-%d)"
          git push